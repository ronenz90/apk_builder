<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APK Builder — Stats</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --green: #3fb950;
      --red: #f85149;
      --yellow: #d29922;
      --blue: #58a6ff;
      --purple: #bc8cff;
      --accent: #238636;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding: 24px 16px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    header svg { color: var(--green); }

    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
    }

    header span {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 28px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      text-align: center;
    }

    .card .num {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 4px;
    }

    .card .label {
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .card.total .num  { color: var(--blue); }
    .card.success .num { color: var(--green); }
    .card.fail .num   { color: var(--red); }
    .card.apps .num   { color: var(--purple); }
    .card.rate .num   { color: var(--yellow); }

    .section-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
    }

    .bar-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .bar-row:last-child { margin-bottom: 0; }

    .bar-label {
      width: 60px;
      font-size: 0.75rem;
      color: var(--muted);
      text-align: right;
      flex-shrink: 0;
    }

    .bar-track {
      flex: 1;
      background: var(--surface2);
      border-radius: 4px;
      height: 18px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.6s ease;
      display: flex;
      align-items: center;
      padding-left: 6px;
      font-size: 0.7rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .bar-fill.debug   { background: var(--blue); }
    .bar-fill.release { background: var(--green); }
    .bar-fill.aab     { background: var(--purple); }

    .bar-count {
      width: 28px;
      font-size: 0.8rem;
      color: var(--text);
      flex-shrink: 0;
      text-align: right;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    th {
      text-align: left;
      padding: 8px 10px;
      color: var(--muted);
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      font-size: 0.75rem;
      text-transform: uppercase;
    }

    td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .badge.success { background: rgba(63,185,80,.15); color: var(--green); }
    .badge.error   { background: rgba(248,81,73,.15);  color: var(--red); }
    .badge.running { background: rgba(88,166,255,.15); color: var(--blue); }
    .badge.debug   { background: rgba(88,166,255,.12); color: var(--blue); }
    .badge.release { background: rgba(63,185,80,.12);  color: var(--green); }
    .badge.aab     { background: rgba(188,140,255,.12);color: var(--purple); }

    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box {
      background: rgba(248,81,73,.1);
      border: 1px solid rgba(248,81,73,.3);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--red);
      font-size: 0.85rem;
      margin-bottom: 20px;
    }

    .refresh-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      margin-left: auto;
      display: block;
      margin-bottom: 16px;
    }

    .refresh-btn:hover { background: var(--border); }

    .app-name {
      font-weight: 600;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ts { color: var(--muted); font-size: 0.75rem; }

    .success-bar {
      display: flex;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 6px;
      gap: 2px;
    }

    .success-bar .s { background: var(--green); flex: var(--s); }
    .success-bar .f { background: var(--red);   flex: var(--f); }

    @media (max-width: 500px) {
      .cards { grid-template-columns: repeat(3, 1fr); }
      .card .num { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

<header>
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <rect x="5" y="2" width="14" height="20" rx="2"/>
    <line x1="12" y1="18" x2="12" y2="18.01"/>
  </svg>
  <div>
    <h1>APK Builder Stats</h1>
    <span id="last-updated">Loading…</span>
  </div>
  <button class="refresh-btn" onclick="loadAll()" style="margin-left:auto;margin-bottom:0">↻ Refresh</button>
</header>

<div id="root"><div class="loading"><span class="spinner"></span>Fetching data…</div></div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
const GITHUB_OWNER = 'ronenz90';
const GITHUB_REPO  = 'Apk_build';
const RAILWAY_URL  = 'https://apkbuilder-production.up.railway.app';

// ── FETCH HELPERS ─────────────────────────────────────────────────────────────
async function ghFetch(path, params = '') {
  const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}${path}${params}`;
  const r = await fetch(url, { headers: { Accept: 'application/vnd.github+json' } });
  if (!r.ok) throw new Error(`GitHub ${r.status}: ${r.statusText}`);
  return r.json();
}

async function getAllRuns() {
  let runs = [], page = 1;
  while (true) {
    const data = await ghFetch('/actions/runs', `?per_page=100&page=${page}`);
    if (!data.workflow_runs?.length) break;
    runs = runs.concat(data.workflow_runs);
    if (data.workflow_runs.length < 100) break;
    page++;
    if (page > 20) break; // safety
  }
  return runs;
}

async function getStatusFiles() {
  try {
    const r = await fetch(`${RAILWAY_URL}/api/stats`, { signal: AbortSignal.timeout(5000) });
    if (r.ok) return r.json();
  } catch {}
  return null;
}

// ── MAIN ──────────────────────────────────────────────────────────────────────
async function loadAll() {
  document.getElementById('root').innerHTML = '<div class="loading"><span class="spinner"></span>Fetching data…</div>';

  let runs = [], statsData = null, errors = [];

  try { runs = await getAllRuns(); }
  catch (e) { errors.push('GitHub: ' + e.message); }

  try { statsData = await getStatusFiles(); }
  catch (e) { /* optional */ }

  render(runs, statsData, errors);
  document.getElementById('last-updated').textContent =
    'Updated ' + new Date().toLocaleTimeString();
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(runs, statsData, errors) {
  // filter only build workflow runs (main.yml)
  const buildRuns = runs.filter(r =>
    r.name === 'Build APK' || r.path?.includes('main.yml') || r.workflow_id
  );

  const total    = buildRuns.length;
  const success  = buildRuns.filter(r => r.conclusion === 'success').length;
  const failed   = buildRuns.filter(r => r.conclusion === 'failure').length;
  const running  = buildRuns.filter(r => r.status === 'in_progress' || r.status === 'queued').length;
  const rate     = total ? Math.round(success / total * 100) : 0;

  // build type from run name / display_title
  const typeCount = { debug: 0, release: 0, aab: 0 };
  buildRuns.forEach(r => {
    const t = (r.display_title || r.head_commit?.message || '').toLowerCase();
    if (t.includes('aab'))          typeCount.aab++;
    else if (t.includes('release')) typeCount.release++;
    else                            typeCount.debug++;
  });

  // app names from display_title (format: "Build app-name [type]")
  const appMap = {};
  buildRuns.forEach(r => {
    const title = r.display_title || '';
    // Try to extract app name — strip leading "Build " and trailing " [type]" or version
    let name = title
      .replace(/^Build\s+/i, '')
      .replace(/\s*[\[\(](debug|release|aab)[^\]]*[\]\)]/i, '')
      .replace(/\s+-v[\d.]+.*$/i, '')
      .trim() || 'Unknown';
    if (!appMap[name]) appMap[name] = { total: 0, success: 0 };
    appMap[name].total++;
    if (r.conclusion === 'success') appMap[name].success++;
  });

  const appList = Object.entries(appMap)
    .sort((a, b) => b[1].total - a[1].total)
    .slice(0, 20);

  // recent runs
  const recent = buildRuns.slice(0, 12);

  // ── HTML ──
  const typeMax = Math.max(...Object.values(typeCount), 1);

  const html = `
    ${errors.length ? `<div class="error-box">⚠️ ${errors.join('<br>')}</div>` : ''}

    <div class="cards">
      <div class="card total">
        <div class="num">${total}</div>
        <div class="label">Total Builds</div>
      </div>
      <div class="card success">
        <div class="num">${success}</div>
        <div class="label">Succeeded</div>
      </div>
      <div class="card fail">
        <div class="num">${failed}</div>
        <div class="label">Failed</div>
      </div>
      <div class="card apps">
        <div class="num">${Object.keys(appMap).length}</div>
        <div class="label">Unique Apps</div>
      </div>
      <div class="card rate">
        <div class="num">${rate}%</div>
        <div class="label">Success Rate</div>
      </div>
      ${running ? `<div class="card" style="border-color:rgba(88,166,255,.4)">
        <div class="num" style="color:var(--blue)">${running}</div>
        <div class="label">Running Now</div>
      </div>` : ''}
    </div>

    <div class="section-title">Build Types</div>
    <div class="bar-wrap" style="margin-bottom:28px">
      ${['debug','release','aab'].map(type => `
        <div class="bar-row">
          <div class="bar-label">${type.toUpperCase()}</div>
          <div class="bar-track">
            <div class="bar-fill ${type}" style="width:${Math.round(typeCount[type]/typeMax*100)}%">
              ${typeCount[type] > 0 ? '' : ''}
            </div>
          </div>
          <div class="bar-count">${typeCount[type]}</div>
        </div>
      `).join('')}
    </div>

    <div class="section-title">Apps Built</div>
    <div class="table-wrap" style="margin-bottom:28px">
      <table>
        <thead><tr>
          <th>App Name</th>
          <th>Builds</th>
          <th>Success</th>
        </tr></thead>
        <tbody>
          ${appList.length ? appList.map(([name, s]) => `
            <tr>
              <td><div class="app-name" title="${name}">${name}</div></td>
              <td>${s.total}</td>
              <td>
                <span class="badge ${s.success === s.total ? 'success' : s.success === 0 ? 'error' : 'running'}">
                  ${s.success}/${s.total}
                </span>
              </td>
            </tr>
          `).join('') : '<tr><td colspan="3" style="color:var(--muted);text-align:center;padding:20px">No data</td></tr>'}
        </tbody>
      </table>
    </div>

    <div class="section-title">Recent Builds</div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>App</th>
          <th>Type</th>
          <th>Status</th>
          <th>When</th>
        </tr></thead>
        <tbody>
          ${recent.length ? recent.map(r => {
            const title = r.display_title || 'Build';
            const name  = title.replace(/^Build\s+/i,'').replace(/\s*[\[\(](debug|release|aab)[^\]]*[\]\)]/i,'').replace(/\s+-v[\d.]+.*$/i,'').trim() || title;
            const t     = title.toLowerCase();
            const type  = t.includes('aab') ? 'aab' : t.includes('release') ? 'release' : 'debug';
            const conc  = r.conclusion || r.status;
            const cls   = conc === 'success' ? 'success' : conc === 'failure' ? 'error' : 'running';
            const label = conc === 'in_progress' ? 'Running' : conc === 'queued' ? 'Queued' : conc || '…';
            const when  = r.created_at ? timeAgo(new Date(r.created_at)) : '';
            return `<tr>
              <td><div class="app-name" title="${name}">${name}</div></td>
              <td><span class="badge ${type}">${type}</span></td>
              <td><span class="badge ${cls}">${label}</span></td>
              <td class="ts">${when}</td>
            </tr>`;
          }).join('') : '<tr><td colspan="4" style="color:var(--muted);text-align:center;padding:20px">No runs found</td></tr>'}
        </tbody>
      </table>
    </div>
  `;

  document.getElementById('root').innerHTML = html;
}

function timeAgo(date) {
  const s = Math.floor((Date.now() - date) / 1000);
  if (s < 60)   return s + 's ago';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}

loadAll();
</script>
</body>
</html>
