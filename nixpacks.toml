[phases.setup]
nixPkgs = [
  "jdk17",
  "wget",
  "unzip",
  "curl",
  "git",
  "bash",
  "findutils",
  "coreutils"
]

[phases.build]
cmds = [
  "echo '=== Installing Android SDK ==='",
  "mkdir -p $HOME/android-sdk/cmdline-tools",
  "wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip",
  "unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools",
  "mv /tmp/cmdtools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest",
  "rm -rf /tmp/cmdtools /tmp/cmdtools.zip",
  "export ANDROID_HOME=$HOME/android-sdk && export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools",
  "yes | sdkmanager --licenses > /dev/null 2>&1 || true",
  "sdkmanager 'platform-tools' 'platforms;android-34' 'platforms;android-33' 'build-tools;34.0.0' 'build-tools;33.0.2' > /dev/null 2>&1",
  "echo '=== Android SDK installed ==='",
  "cd backend && npm ci --only=production",
  "cd frontend && npm ci && npm run build"
]

[start]
cmd = "node backend/server.js"
