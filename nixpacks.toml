[phases.setup]
nixPkgs = [
  "nodejs_20",
  "jdk17",
  "android-tools",
  "wget",
  "unzip",
  "curl",
  "bash",
  "findutils",
  "coreutils",
  "gradle"
]

[phases.install]
cmds = [
  "cd backend && npm ci --only=production",
  "cd frontend && npm ci && npm run build"
]

[start]
cmd = "node backend/server.js"
